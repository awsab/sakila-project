spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:mysql://localhost:3306/sakila?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Oman@2017
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8090

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    #disable-swagger-default-url: false

# Logging Configuration
logging:
  level:
    com.me.learning.parent.customerservice: INFO
    com.me.learning.parent.customerservice.config.LoggingInterceptor: INFO
    org.springframework.web: INFO
